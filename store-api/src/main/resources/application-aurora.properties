# Aurora PostgreSQL with IAM sign-in (no stored password). See IamAuthDataSource.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USER:postgres}
store.seed-sample-data=${SEED_SAMPLE_DATA:false}
spring.flyway.locations=classpath:db/migration-postgres

# Few connections and none kept idle, so the database can pause. A sign-in token lasts 15 minutes, so
# no connection is kept longer than 10. The timeouts leave room for a paused database to wake up.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=45000
spring.flyway.connect-retries=6

# Start-up must not open a database connection: Lambda sometimes starts a copy with no request waiting,
# and a connection would wake a paused database. So the pool opens nothing until first use, and
# Hibernate is told the dialect instead of asking the database. Where this runs on Lambda, Flyway and
# sample data are switched off too (see the deploy script, which applies migrations instead).
spring.datasource.hikari.initialization-fail-timeout=-1
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
