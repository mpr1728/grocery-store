spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:store}
spring.datasource.username=${DB_USER:store}
spring.datasource.password=${DB_PASSWORD}
store.seed-sample-data=${SEED_SAMPLE_DATA:false}
# Same schema as db/migration, written for PostgreSQL. A new migration must be added to both folders.
spring.flyway.locations=classpath:db/migration-postgres
