server.port=8080
spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

store.timezone=Asia/Kolkata
store.delivery-fee-paise=2900
store.free-delivery-above-paise=49900

# Reward points. One point is worth one rupee at checkout.
store.reward-earn-percent=2
store.reward-welcome-points=50

# Shopping assistant: name of the Lambda function that calls the model. Empty switches the
# assistant off, so local runs need no AWS access.
store.assistant-function=${ASSISTANT_FUNCTION:}
store.assistant-daily-limit=40

# Sign-up codes by email. An empty sender means no code is sent and the address is taken on trust,
# so local runs need no mail service.
store.brand-name=Panyaloka Fresh
store.brand-tagline=Better food. Better living.
store.mail-from=${MAIL_FROM:}

# When set, the API answers only requests that carry this value in the X-Origin-Secret header,
# which the CDN in front of it adds. Empty lets everything through.
store.origin-secret=${ORIGIN_SECRET:}

# Uploaded certificates and lab reports.
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=5MB

# Panyaloka Fashion: shipping for one made-to-order garment, free at or above the threshold.
fashion.shipping-paise=9900
fashion.free-shipping-above-paise=199900

# Passkeys belong to one web address. rp-id is that host name (no scheme or port); origins are the exact
# addresses pages are served from. Locally both front ends run on localhost.
store.passkey-rp-id=${PASSKEY_RP_ID:localhost}
store.passkey-rp-name=Panyaloka
store.passkey-origins=${PASSKEY_ORIGINS:http://localhost:5173,http://localhost:5174}
